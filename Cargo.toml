[package]
name = "workflow-cli"
version = "0.1.0"
edition = "2021"
description = "Ocean 工作流执行引擎，供 Agent 调用"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = "0.4"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "workflow"
path = "src/main.rs"
